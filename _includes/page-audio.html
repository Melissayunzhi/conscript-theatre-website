{%- comment -%} Inline audio player, styled like the Wix one: play button + thin progress line. {%- endcomment -%}
{%- assign a = include.src | strip -%}
{%- if a != "" -%}
<div class="page-audio" data-page-audio>
  <audio src="{% include src.html src=a %}" preload="none"></audio>
  <button class="pa-btn" type="button" aria-label="Play sound" aria-pressed="false">
    <svg class="pa-play" viewBox="0 0 18 20" width="14" height="16" aria-hidden="true"><path d="M0 0l18 10L0 20z" fill="currentColor"/></svg>
    <svg class="pa-pause" viewBox="0 0 18 20" width="14" height="16" aria-hidden="true"><path d="M2 0h5v20H2zM11 0h5v20h-5z" fill="currentColor"/></svg>
  </button>
  <span class="pa-track" aria-hidden="true"><span class="pa-fill"></span></span>
</div>
{%- endif -%}
