<header class="site-header">
  <a class="site-logo" href="{{ '/' | relative_url }}" aria-label="Conscript Theatre home">
    <img src="{% include src.html src=site.data.settings.logo_header %}" alt="Conscript Theatre" width="140" height="37">
  </a>
  <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">
    <span class="nav-toggle-bars" aria-hidden="true"></span>
    <span class="visually-hidden">Menu</span>
  </button>
  <nav class="site-nav" id="site-nav" aria-label="Main">
    <ul>
      {%- for item in site.data.navigation %}
      {%- assign active = false -%}
      {%- if item.url == '/' and page.url == '/' -%}{%- assign active = true -%}
      {%- elsif item.url != '/' and page.url contains item.url -%}{%- assign active = true -%}
      {%- endif %}
      <li><a href="{{ item.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
      {%- endfor %}
    </ul>
  </nav>
</header>
