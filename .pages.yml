# Pages CMS configuration — https://pagescms.org/docs/
#edit here if you want to make site changes that the other tabs doesn't allow you to.

media:
  - name: images
    label: Images
    input: assets/images
    output: /assets/images
    extensions: [jpg, jpeg, png, webp, gif, avif]
  - name: audio
    label: Audio
    input: assets/audio
    output: /assets/audio
    extensions: [mp3, m4a, ogg]
  - name: video
    label: Video
    input: assets/video
    output: /assets/video
    extensions: [mp4, webm]

content:
  # ---------------------------------------------------------------- Shows
  - name: shows
    label: Shows
    type: collection
    path: _shows
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, status, year]
      sort: order
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: status
        label: Status
        type: select
        description: "Current = the big card at the top of Projects and the strip on the homepage (keep the newest show as Current even after it finishes, and change the labels to say 'Recent'). Past = listed under Previous Work."
        options:
          values: [current, past]
      - { name: order, label: Order, type: number, description: "Lower numbers appear first." }
      - { name: year, label: Year, type: number }
      - name: title_font
        label: Title typeface
        type: select
        options:
          values:
            - { value: jost, label: "Jost (main font)" }
            - { value: cormorant, label: "Cormorant Garamond (serif)" }
            - { value: questrial, label: "Questrial (round, like eco 40-60°)" }
            - { value: display, label: "Conscript heading font" }
      - { name: title_image, label: "Title graphic (optional, replaces the title on Projects)", type: image, options: { media: images } }
      - { name: subtitle, label: "Subtitle (dates and places)", type: text }
      - { name: description, label: "Search engine description", type: text }
      - { name: body, label: Story, type: rich-text }
      - { name: audio, label: "Page sound (mp3, under 15 MB)", type: file, options: { media: audio } }
      - { name: hero, label: "Main image / poster", type: image, options: { media: images } }
      - name: summary
        label: "Short summary (Previous Work list)"
        type: text
      - { name: more_label, label: "Text before the button (Previous Work list)", type: string }
      - { name: more_button, label: "Button text (Previous Work list)", type: string }
      - { name: card_image, label: "Card background (current show)", type: image, options: { media: images } }
      - { name: card_text, label: "Card text (current show)", type: rich-text }
      - { name: event_line, label: "Event (current show, top right of card)", type: text }
      - { name: tickets_url, label: Tickets link, type: string }
      - { name: tickets_label, label: Tickets button text, type: string }
      - { name: co_producers, label: Co-producers, type: string, list: true }
      - { name: awards, label: Award laurels, type: image, list: true, options: { media: images } }
      - name: trailer
        label: Trailer
        type: string
        description: "A YouTube or Vimeo link, or /assets/video/<file>.mp4 for a video uploaded under Video (keep it under 50 MB)."
      - { name: trailer_poster, label: Trailer still image, type: image, options: { media: images } }
      - { name: media_heading, label: Video clips heading, type: string }
      - name: media
        label: Video clips
        type: object
        list:
          collapsible: { collapsed: true, summary: "Clip {index}" }
        fields:
          - { name: video, label: "Video (YouTube/Vimeo link or /assets/video/... mp4)", type: string }
          - { name: poster, label: Still image, type: image, options: { media: images } }
          - { name: caption, label: Caption, type: text }
      - { name: gallery, label: "Photos (also used for the slideshow on Projects)", type: image, list: true, options: { media: images } }
      - { name: gallery_heading, label: Photo gallery heading, type: string }
      - name: gallery_style
        label: Show photos on the show page as
        type: select
        options:
          values:
            - { value: slider, label: Slideshow }
            - { value: grid, label: Grid }
            - { value: none, label: "Don't show (Projects slideshow only)" }
      - { name: history_heading, label: History heading, type: string }
      - { name: history, label: Development history, type: rich-text }
      - { name: history_images, label: History images, type: image, list: true, options: { media: images } }
      - { name: history_note, label: History small print (funders etc.), type: rich-text }
      - { name: questions, label: Extra text block (beside the poster), type: rich-text }
      - { name: quotes_heading, label: Quotes heading, type: string }
      - name: quotes
        label: Quotes
        type: object
        list:
          collapsible: { collapsed: true, summary: "Quote {index}" }
        fields:
          - { name: text, label: Quote, type: text }
          - { name: source, label: "Who said it (optional)", type: string }
      - { name: quotes_image, label: Photo beside quotes, type: image, options: { media: images } }
      - { name: review, label: Review, type: rich-text }
      - { name: review_images, label: Photos beside review, type: image, list: true, options: { media: images } }
      - { name: credits, label: Show credits, type: rich-text }
      - { name: credits_image, label: Photo beside credits, type: image, options: { media: images } }
      - { name: photo_credit, label: Photographer, type: string }
      - { name: booking_cta, label: "Show the 'Are you a theatre venue or festival?' box", type: boolean }
      - { name: cta_line, label: "Line under it", type: string }
      - { name: redirect_from, type: string, list: true, hidden: true }

  # ---------------------------------------------------------------- Pages
  - name: home
    label: Homepage
    type: file
    path: index.md
    fields:
      - name: showreel
        label: Showreel
        type: string
        description: "Plays automatically, muted, above the logo. A YouTube or Vimeo link, or /assets/video/<file>.mp4 (under 50 MB). Leave empty to hide."
      - { name: showreel_poster, label: Showreel still image, type: image, options: { media: images } }
      - { name: logo_image, label: Big logo image, type: image, options: { media: images } }
      - { name: logo_alt, label: Big logo description, type: string }
      - { name: photo, label: Photo, type: image, options: { media: images } }
      - { name: photo_alt, label: Photo description, type: string }
      - { name: tagline, label: Tagline, type: text }
      - { name: button_label, label: Button text, type: string }
      - { name: button_link, label: Button link, type: string }
      - { name: show_now_showing, label: "Show the current-show strip", type: boolean }
      - { name: now_label, label: "Label above the show in that strip", type: string, description: "e.g. Now showing (while it's on) or Recent show (after it's finished)" }
      - { name: layout, type: string, hidden: true }
      - { name: title, type: string, hidden: true }
      - { name: page_id, type: string, hidden: true }
      - { name: theme, type: string, hidden: true }

  - name: about
    label: About page
    type: file
    path: about.md
    fields:
      - name: sections
        label: Sections
        type: object
        description: "Drag sections to reorder them."
        list:
          collapsible: { collapsed: true, summary: "{heading} ({index})" }
        fields:
          - name: theme
            label: Background
            type: select
            options:
              values:
                - { value: dark, label: Black }
                - { value: light, label: White }
          - name: layout
            label: Layout
            type: select
            options:
              values:
                - { value: image-left, label: "Big image left, text right" }
                - { value: image-right, label: "Text left, big image right" }
                - { value: text, label: "Text only" }
                - { value: photos, label: "Photo wall" }
          - { name: heading, label: Heading, type: string }
          - name: heading_size
            label: Heading size
            type: select
            options:
              values: [normal, huge]
          - { name: audio, label: "Sound next to heading", type: file, options: { media: audio } }
          - { name: lead, label: "Big lines under heading", type: text }
          - { name: body, label: Text, type: rich-text }
          - { name: image, label: Big image, type: image, options: { media: images } }
          - { name: image_alt, label: Image description, type: string }
          - { name: note, label: "Text under the big image", type: rich-text }
          - { name: small_image, label: "Small image under the text", type: image, options: { media: images } }
          - { name: photos, label: "Photos (photo wall only)", type: image, list: true, options: { media: images } }
      - { name: values_heading, label: Values heading, type: string }
      - { name: values_image, label: Values image, type: image, options: { media: images } }
      - name: values
        label: Values
        type: text
        list: true
        description: "One group per box, one word per line."
      - { name: values_statement, label: Values statement, type: rich-text }
      - { name: layout, type: string, hidden: true }
      - { name: title, type: string, hidden: true }
      - { name: page_id, type: string, hidden: true }
      - { name: permalink, type: string, hidden: true }
      - { name: redirect_from, type: string, list: true, hidden: true }

  - name: projects
    label: Projects page
    type: file
    path: projects.md
    fields:
      - { name: audio, label: "Sound next to heading", type: file, options: { media: audio } }
      - { name: current_label, label: "Line above the current show's text", type: string }
      - { name: previous_heading, label: "Heading above past shows", type: string }
      - { name: layout, type: string, hidden: true }
      - { name: title, type: string, hidden: true }
      - { name: page_id, type: string, hidden: true }
      - { name: permalink, type: string, hidden: true }

  - name: team
    label: Meet the Team page
    type: file
    path: team.md
    fields:
      - { name: audio, label: "Sound next to heading", type: file, options: { media: audio } }
      - { name: description, label: Search engine description, type: text }
      - { name: intro, label: Intro, type: rich-text }
      - name: members
        label: Team members
        type: object
        list:
          collapsible: { collapsed: true, summary: "{name}" }
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: title, label: "Title (e.g. Artistic Director)", type: string }
          - { name: roles, label: Roles, type: string }
          - { name: photo, label: Photo, type: image, options: { media: images } }
          - { name: photo_hover, label: "Second photo (swaps in on hover / tap)", type: image, options: { media: images } }
          - { name: bio, label: Bio, type: rich-text }
      - { name: collaborators_heading, label: Collaborators heading, type: string }
      - { name: collaborators_intro, label: Collaborators intro, type: text }
      - name: collaborators
        label: Collaborators
        type: object
        list:
          collapsible: { collapsed: true, summary: "{name}" }
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: role, label: "Role / project", type: string }
          - { name: link, label: "Website or Instagram link (optional)", type: string }
      - { name: layout, type: string, hidden: true }
      - { name: title, type: string, hidden: true }
      - { name: page_id, type: string, hidden: true }
      - { name: permalink, type: string, hidden: true }

  - name: contact
    label: Contact page
    type: file
    path: contact.md
    fields:
      - { name: description, label: Search engine description, type: text }
      - { name: heading, label: Heading, type: string }
      - { name: intro, label: Text, type: rich-text }
      - { name: form_heading, label: Grey box heading, type: string }
      - { name: layout, type: string, hidden: true }
      - { name: title, type: string, hidden: true }
      - { name: page_id, type: string, hidden: true }
      - { name: permalink, type: string, hidden: true }
      - { name: redirect_from, type: string, list: true, hidden: true }

  # ---------------------------------------------------------------- Site-wide
  - name: settings
    label: Site settings
    type: file
    path: _data/settings.yml
    fields:
      - { name: email, label: Email, type: string }
      - { name: instagram, label: Instagram link, type: string }
      - { name: instagram_handle, label: "Instagram handle (no @)", type: string }
      - { name: youtube, label: YouTube link, type: string }
      - name: ambient_audio
        label: Site-wide ambient sound
        type: file
        description: "Optional. Adds a 'sound on' button bottom-left that keeps playing between pages. Leave empty to hide."
        options: { media: audio }
      - { name: ambient_label, label: Ambient sound label, type: string }
      - { name: logo_header, label: "Header logo (white)", type: image, options: { media: images } }
      - { name: logo_text, label: "Footer / team logo (black)", type: image, options: { media: images } }
      - { name: share_image, label: Image shown when the site is shared, type: image, options: { media: images } }
      - { name: copyright, label: Footer copyright line, type: string }
      - { name: contact_form_endpoint, label: "Contact form endpoint (Formspree URL, optional)", type: string }
      - { name: display_font, type: string, hidden: true }

  - name: navigation
    label: Menu
    type: file
    path: _data/navigation.yml
    list: true
    fields:
      - { name: title, label: Label, type: string }
      - { name: url, label: Link, type: string }
